# MIREKU release - Windows installer and a signed, notarised, stapled macOS .pkg.
#
# The certificates and the App Store Connect key are ORGANISATION secrets
# (visibility: All repositories); nothing secret lives in this repository. The
# heavy lifting is in apps/signature/scripts/build-mac-pkg.sh and
# build-windows-installer.ps1, so the same steps can be run by hand.
#
# COST: macOS runners bill at about ten times Linux, so this never runs on an
# ordinary push - only on a mireku-v* tag or when started by hand.
#
# A TEST build (tester=true) carries the key gate in src/plugin/TesterGate.h,
# is named "-Tester-" and MUST NOT be sold. Both scripts read the built binary's
# bytes and refuse to package a release that still contains the key, or a tester
# package that does not.
name: MIREKU release

on:
  workflow_dispatch:
    inputs:
      tester:
        description: "Build a TEST package (asks for a test key; never sell it)"
        type: boolean
        default: true
  push:
    tags: ["mireku-v*"]

concurrency:
  group: mireku-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # The C++ suite plays notes through real .jmi bundles, and testdata/*.jmi/
      # is gitignored - those are sample content, not source. Without them every
      # audio assertion fails for want of an instrument, which is exactly how the
      # first run of this workflow failed. Same fixtures ci.yml uses.
      - name: Generate the test fixtures
        run: |
          npm ci
          npm run build -w @jm/jmi-format
          npm run generate:quick -w @jm/placeholder-gen

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build and package
        shell: pwsh
        run: |
          $splat = @{ SkipTests = $false }
          if ("${{ inputs.tester }}" -eq "true") { $splat.Tester = $true }
          & "apps\signature\scripts\build-windows-installer.ps1" @splat

      - uses: actions/upload-artifact@v4
        with:
          name: MIREKU-Windows
          path: apps/signature/release/*.exe
          if-no-files-found: error

  macos-pkg:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      MIREKU_TESTER: ${{ inputs.tester && '1' || '0' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # See the Windows job: build-mac-pkg.sh runs MirekuTests, which needs real
      # .jmi bundles, and testdata/*.jmi/ is gitignored sample content.
      - name: Generate the test fixtures
        run: |
          npm ci
          npm run build -w @jm/jmi-format
          npm run generate:quick -w @jm/placeholder-gen

      - name: Import the signing certificates
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_INSTALLER_P12: ${{ secrets.MAC_INSTALLER_P12 }}
          MAC_INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # An empty secret means the org secret is not visible to this repository;
          # say so now rather than shipping an unsigned package by accident.
          for v in MAC_CERT_P12 MAC_INSTALLER_P12 ASC_KEY_P8 APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::secret $v is empty - check the organisation secret's repository visibility"; exit 1; }
          done
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          echo "$MAC_CERT_P12"      | tr -d '[:space:]' | base64 --decode > app.p12
          echo "$MAC_INSTALLER_P12" | tr -d '[:space:]' | base64 --decode > installer.p12
          trim () { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          security import app.p12       -k "$KEYCHAIN" -P "$(trim "$MAC_CERT_PASSWORD")"      -T /usr/bin/codesign -T /usr/bin/productsign
          security import installer.p12 -k "$KEYCHAIN" -P "$(trim "$MAC_INSTALLER_PASSWORD")" -T /usr/bin/codesign -T /usr/bin/productsign
          rm -f app.p12 installer.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-identity -v

          # The key may have been stored as base64 or as the raw .p8 text.
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          else printf '%s' "$ASC_KEY_P8" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/asc.p8"; fi
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarise and staple
        run: bash apps/signature/scripts/build-mac-pkg.sh

      - name: Remove the key material
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"; security delete-keychain build.keychain || true

      - uses: actions/upload-artifact@v4
        with:
          name: MIREKU-macOS
          path: |
            apps/signature/release/*.pkg
            apps/signature/release/auval.txt
          if-no-files-found: error
