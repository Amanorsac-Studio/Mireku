<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="fm-weave" patternUnits="userSpaceOnUse" width="120" height="120">
      <!-- Base Gold -->
      <rect width="120" height="120" fill="#D9A648"/>
      
      <!-- Vertical Striping -->
      <line x1="15" y1="0" x2="15" y2="120" stroke="#0C0A07" stroke-width="6"/>
      <line x1="45" y1="0" x2="45" y2="120" stroke="#0C0A07" stroke-width="6"/>
      <line x1="75" y1="0" x2="75" y2="120" stroke="#0C0A07" stroke-width="6"/>
      <line x1="105" y1="0" x2="105" y2="120" stroke="#0C0A07" stroke-width="6"/>
      
      <!-- Offset Blue Block -->
      <rect x="0" y="20" width="60" height="40" fill="#2A5B84"/>
      <rect x="0" y="35" width="60" height="10" fill="#D9A648"/>
      
      <!-- Offset Red/Green Block -->
      <rect x="60" y="60" width="60" height="40" fill="#8B1A1A"/>
      <rect x="60" y="75" width="60" height="10" fill="#274E27"/>
      
      <!-- Woven Texture Lines inside blocks -->
      <line x1="0" y1="25" x2="60" y2="25" stroke="#0C0A07" stroke-width="2" stroke-dasharray="4 2"/>
      <line x1="60" y1="65" x2="120" y2="65" stroke="#0C0A07" stroke-width="2" stroke-dasharray="4 2"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#fm-weave)"/>
</svg>
