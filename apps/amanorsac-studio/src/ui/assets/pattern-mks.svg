<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="mks-weave" patternUnits="userSpaceOnUse" width="100" height="100">
      <!-- Base Gold -->
      <rect width="100" height="100" fill="#D9A648"/>
      
      <!-- Checker/Diamond Column (Left) -->
      <rect x="0" y="0" width="50" height="100" fill="#6B1A1A"/>
      <polygon points="25,10 45,25 25,40 5,25" fill="#274E27"/>
      <polygon points="25,60 45,75 25,90 5,75" fill="#0C0A07"/>
      <rect x="0" y="45" width="50" height="10" fill="#D9A648"/>
      
      <!-- Zig-Zag Column (Right) -->
      <rect x="50" y="0" width="50" height="100" fill="#D9A648"/>
      <!-- Green Zig Zags -->
      <polygon points="50,10 75,20 50,30 50,10" fill="#274E27"/>
      <polygon points="50,50 75,60 50,70 50,50" fill="#274E27"/>
      <!-- Dark Zig Zags -->
      <polygon points="100,25 75,35 100,45 100,25" fill="#0C0A07"/>
      <polygon points="100,75 75,85 100,95 100,75" fill="#0C0A07"/>
      
      <!-- Divider Lines -->
      <line x1="50" y1="0" x2="50" y2="100" stroke="#EFE7D4" stroke-width="1.5" opacity="0.8"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#mks-weave)"/>
</svg>
