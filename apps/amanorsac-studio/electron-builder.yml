appId: studio.amanorsac.studio
productName: Amanorsac Studio
directories:
  output: release
  buildResources: icons
files:
  - dist/**
  - dist-electron/**
  - package.json
  - node_modules/@jm/jmi-format/dist/**
  - node_modules/@jm/jmi-format/schema/**
  - node_modules/@jm/jmi-format/package.json
  - node_modules/@amanorsac/aofas-format/dist/**
  - node_modules/@amanorsac/aofas-format/package.json
  - node_modules/adm-zip/**
  - node_modules/ajv/**
  - node_modules/fast-deep-equal/**
  - node_modules/json-schema-traverse/**
  - node_modules/fast-uri/**
asar: true
mac:
  category: public.app-category.music
  target:
    - dmg
    - zip
  artifactName: Amanorsac-Studio-${version}-mac.${ext}
win:
  icon: icons/icon.ico
  target:
    - nsis
  artifactName: Amanorsac-Studio-${version}-win.${ext}
nsis:
  oneClick: false
  installerIcon: icons/icon.ico
  uninstallerIcon: icons/icon.ico
  installerHeaderIcon: icons/icon.ico
  shortcutName: Amanorsac Studio
  createDesktopShortcut: true
  allowToChangeInstallationDirectory: true

# Electron is hoisted to the monorepo root by npm workspaces, so
# electron-builder cannot infer the version from apps/capture. Pin it.
electronVersion: 33.4.11
