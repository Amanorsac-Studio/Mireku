# MIREKU release - Windows installer and a signed, notarised, stapled macOS .pkg.
#
# The certificates and the App Store Connect key are ORGANISATION secrets
# (visibility: All repositories); nothing secret lives in this repository. The
# heavy lifting is in apps/signature/scripts/build-mac-pkg.sh and
# build-windows-installer.ps1, so the same steps can be run by hand.
#
# COST: macOS runners bill at about ten times Linux, so this never runs on an
# ordinary push - only on a mireku-v* tag or when started by hand.
#
# A TEST build (tester=true) carries the key gate in src/plugin/TesterGate.h,
# is named "-Tester-" and MUST NOT be sold. Both scripts read the built binary's
# bytes and refuse to package a release that still contains the key, or a tester
# package that does not.
name: MIREKU release

on:
  workflow_dispatch:
    inputs:
      tester:
        description: "Build a TEST package (asks for a test key; never sell it)"
        type: boolean
        default: true
      windows_only:
        description: "Skip the macOS package (it bills ~10x; a Windows-only tester update does not need it)"
        type: boolean
        default: false
      ios:
        description: "Build ONLY the iPad app for the simulator and screenshot it (no Windows or macOS package)"
        type: boolean
        default: false
      testflight:
        description: "Build ONLY the iPad app for a real iPad, sign it and upload it to TestFlight"
        type: boolean
        default: false
  push:
    tags: ["mireku-v*"]

concurrency:
  group: mireku-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE iPAD APP, first stage: prove it compiles for iOS and opens. Built for the
  # simulator, unsigned, so it needs no Apple certificate; it is launched in an
  # iPad simulator and the screen is saved as the artifact. A build for a real
  # iPad or the App Store needs an iOS distribution certificate and a
  # provisioning profile for com.mireku.app, which are not set up yet.
  ipad-simulator:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ios }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      AOFAS_STUDIO_KEY: ${{ secrets.AOFAS_STUDIO_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Configure for iOS
        run: |
          cmake -S apps/signature -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DMIREKU_PLAYER_BUILD=ON \
            -DMIREKU_LIBRARY_URL=https://library.amanorsac.studio/MIREKU-Library.mirekupack

      - name: Build for the simulator
        run: |
          set -o pipefail
          cmake --build build-ios --config Release --target Mireku_Standalone -- \
            -sdk iphonesimulator -arch arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build-ios.log | grep -E "error|warning: unused|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build-ios.log || { grep -E "error" build-ios.log | head -60; exit 1; }

      - name: Run in an iPad simulator and take screenshots
        run: |
          APP="$(find build-ios -name 'MIREKU.app' -type d | head -1)"
          [ -n "$APP" ] || { echo "no MIREKU.app was built"; exit 1; }
          echo "app: $APP"; /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          mkdir -p ipad-shots
          xcrun simctl list devices available | grep -i ipad || true
          UDID="$(xcrun simctl list devices available | grep -i 'iPad Pro' | grep -oE '[0-9A-F-]{36}' | head -1)"
          [ -n "$UDID" ] || UDID="$(xcrun simctl list devices available | grep -i 'iPad' | grep -oE '[0-9A-F-]{36}' | head -1)"
          [ -n "$UDID" ] || { echo "no iPad simulator on this runner"; exit 1; }
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.mireku.app
          sleep 25
          xcrun simctl io "$UDID" screenshot ipad-shots/01-first-launch.png
          sleep 10
          xcrun simctl io "$UDID" screenshot ipad-shots/02-after-10s.png
          xcrun simctl spawn "$UDID" launchctl list | grep -i mireku || echo "MIREKU is not running (it may have crashed)"
          cp build-ios.log ipad-shots/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MIREKU-iPad-simulator
          path: |
            ipad-shots/
            build-ios.log
          if-no-files-found: warn

  # THE iPAD APP, for real iPads: archive, sign for the App Store and upload to
  # App Store Connect, where it appears under TestFlight for com.mireku.app.
  #
  # SIGNING. No iOS certificate or provisioning profile is stored anywhere. The
  # archive is built unsigned; `xcodebuild -exportArchive` then signs it with
  # automatic signing through the App Store Connect API key the Mac job already
  # uses (ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID), which lets Apple issue a
  # cloud-managed distribution certificate and the profile. The key needs the
  # Admin or App Manager role for that.
  #
  # The iPad app is a paid App Store app: it has NO licence gate
  # (MIREKU_LICENSED_BUILD stays OFF) and downloads its library on first launch.
  ipad-testflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      AOFAS_STUDIO_KEY: ${{ secrets.AOFAS_STUDIO_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # App Store Connect refuses anything built with an SDK older than iOS 26
      # (first upload, 2026-11-11: "must be built with the iOS 26 SDK or later").
      # The runner's default Xcode is older, so the newest Xcode 26 on it is chosen.
      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i '^Xcode' || true
          X="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$X" ] || { echo "::error::no Xcode 26 on this runner"; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version

      - name: Prepare the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in ASC_KEY_P8 APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID AOFAS_STUDIO_KEY; do
            [ -n "${!v}" ] || { echo "::error::secret $v is empty - check the organisation secret's repository visibility"; exit 1; }
          done
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          else printf '%s' "$ASC_KEY_P8" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/asc.p8"; fi
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"

      - name: Configure for iOS
        run: |
          cmake -S apps/signature -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON \
            -DCMAKE_XCODE_ATTRIBUTE_SKIP_INSTALL=YES \
            "-DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            -DMIREKU_PLAYER_BUILD=ON \
            -DMIREKU_IOS_BUILD_NUMBER=${{ github.run_number }} \
            -DMIREKU_LIBRARY_URL=https://library.amanorsac.studio/MIREKU-Library.mirekupack
          if grep -q 'kIsTestKey = true' build-ios/generated/StudioKey.h; then
            echo "::error::built with the TEST studio key; it could not open the sealed library"; exit 1
          fi

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project build-ios/Mireku.xcodeproj -scheme Mireku_Standalone \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MIREKU.xcarchive" archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee archive.log | grep -E "error|ARCHIVE|\*\*" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log || { grep -E "error" archive.log | head -60; exit 1; }
          APP="$RUNNER_TEMP/MIREKU.xcarchive/Products/Applications/MIREKU.app"
          [ -d "$APP" ] || { echo "::error::the archive holds no MIREKU.app"; find "$RUNNER_TEMP/MIREKU.xcarchive" -maxdepth 4 | head -40; exit 1; }
          for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion; do
            printf '%s: ' "$k"; /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist"
          done

      - name: Sign for the App Store and upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><false/>
          </dict></plist>
          EOF
          sed -i '' 's/^          //' "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MIREKU.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log | tail -40
          grep -q "EXPORT SUCCEEDED" export.log || { echo "::error::the upload did not succeed"; exit 1; }

      - name: Remove the key material
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MIREKU-iPad-testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: warn

  windows-installer:
    if: ${{ !inputs.ios && !inputs.testflight }}
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      # The STUDIO key the sealed library is opened with (engine/Sealed.h): 64 hex
      # characters, the same key ~/.amanorsac/studio-keys.json holds on the studio
      # machine. Without it the configure compiles the TEST key and the installer
      # script refuses to package.
      AOFAS_STUDIO_KEY: ${{ secrets.AOFAS_STUDIO_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # The C++ suite plays notes through real .jmi bundles, and testdata/*.jmi/
      # is gitignored - those are sample content, not source. Without them every
      # audio assertion fails for want of an instrument, which is exactly how the
      # first run of this workflow failed.
      #
      # The FULL generator, not ci.yml's --quick one: quick makes 8 notes x 2
      # layers = 16 zones, and this suite asserts the spec size of 30 x 4 = 120,
      # which is how the second run failed.
      - name: Generate the test fixtures
        run: |
          npm ci
          npm run build -w @jm/jmi-format
          npm run generate -w @jm/placeholder-gen

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build and package
        shell: pwsh
        run: |
          $splat = @{ SkipTests = $false }
          if ("${{ inputs.tester }}" -eq "true") { $splat.Tester = $true }
          & "apps\signature\scripts\build-windows-installer.ps1" @splat

      - uses: actions/upload-artifact@v4
        with:
          name: MIREKU-Windows
          path: apps/signature/release/*.exe
          if-no-files-found: error

  macos-pkg:
    # A tag build always makes both. A hand-started build can leave macOS out.
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.windows_only && !inputs.ios && !inputs.testflight) }}
    runs-on: macos-15
    timeout-minutes: 120
    # TWO Mac installers for a release (2026-11-11): the main one (universal,
    # macOS 11+) and a separate one for older Macs (Intel, macOS 10.13+). A test
    # build makes only the main one.
    strategy:
      fail-fast: false
      matrix:
        older: ${{ fromJSON(inputs.tester && '["0"]' || '["0","1"]') }}
    env:
      MIREKU_MAC_OLDER: ${{ matrix.older }}
      MIREKU_TESTER: ${{ inputs.tester && '1' || '0' }}
      AOFAS_STUDIO_KEY: ${{ secrets.AOFAS_STUDIO_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # See the Windows job: build-mac-pkg.sh runs MirekuTests, which needs real
      # .jmi bundles, and testdata/*.jmi/ is gitignored sample content.
      - name: Generate the test fixtures
        run: |
          npm ci
          npm run build -w @jm/jmi-format
          npm run generate -w @jm/placeholder-gen

      - name: Import the signing certificates
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_INSTALLER_P12: ${{ secrets.MAC_INSTALLER_P12 }}
          MAC_INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # An empty secret means the org secret is not visible to this repository;
          # say so now rather than shipping an unsigned package by accident.
          for v in MAC_CERT_P12 MAC_INSTALLER_P12 ASC_KEY_P8 APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::secret $v is empty - check the organisation secret's repository visibility"; exit 1; }
          done
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          echo "$MAC_CERT_P12"      | tr -d '[:space:]' | base64 --decode > app.p12
          echo "$MAC_INSTALLER_P12" | tr -d '[:space:]' | base64 --decode > installer.p12
          trim () { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          security import app.p12       -k "$KEYCHAIN" -P "$(trim "$MAC_CERT_PASSWORD")"      -T /usr/bin/codesign -T /usr/bin/productsign
          security import installer.p12 -k "$KEYCHAIN" -P "$(trim "$MAC_INSTALLER_PASSWORD")" -T /usr/bin/codesign -T /usr/bin/productsign
          rm -f app.p12 installer.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-identity -v

          # The key may have been stored as base64 or as the raw .p8 text.
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          else printf '%s' "$ASC_KEY_P8" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/asc.p8"; fi
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarise and staple
        run: bash apps/signature/scripts/build-mac-pkg.sh

      - name: Remove the key material
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"; security delete-keychain build.keychain || true

      - uses: actions/upload-artifact@v4
        with:
          name: MIREKU-macOS${{ matrix.older == '1' && '-OlderMacs' || '' }}
          path: |
            apps/signature/release/*.pkg
            apps/signature/release/auval.txt
          if-no-files-found: error
