# MIREKU release - Windows installer and a signed, notarised, stapled macOS .pkg.
#
# The certificates and the App Store Connect key are ORGANISATION secrets
# (visibility: All repositories); nothing secret lives in this repository. The
# heavy lifting is in apps/signature/scripts/build-mac-pkg.sh and
# build-windows-installer.ps1, so the same steps can be run by hand.
#
# COST: macOS runners bill at about ten times Linux, so this never runs on an
# ordinary push - only on a mireku-v* tag or when started by hand.
#
# A TEST build (tester=true) carries the key gate in src/plugin/TesterGate.h,
# is named "-Tester-" and MUST NOT be sold. Both scripts read the built binary's
# bytes and refuse to package a release that still contains the key, or a tester
# package that does not.
name: MIREKU release

on:
  workflow_dispatch:
    inputs:
      tester:
        description: "Build a TEST package (asks for a test key; never sell it)"
        type: boolean
        default: true
      windows_only:
        description: "Skip the macOS package (it bills ~10x; a Windows-only tester update does not need it)"
        type: boolean
        default: false
      ios:
        description: "Build ONLY the iPad app for the simulator and screenshot it (no Windows or macOS package)"
        type: boolean
        default: false
  push:
    tags: ["mireku-v*"]

concurrency:
  group: mireku-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE iPAD APP, first stage: prove it compiles for iOS and opens. Built for the
  # simulator, unsigned, so it needs no Apple certificate; it is launched in an
  # iPad simulator and the screen is saved as the artifact. A build for a real
  # iPad or the App Store needs an iOS distribution certificate and a
  # provisioning profile for com.mireku.app, which are not set up yet.
  ipad-simulator:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ios }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      AOFAS_STUDIO_KEY: ${{ secrets.AOFAS_STUDIO_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Configure for iOS
        run: |
          cmake -S apps/signature -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DMIREKU_PLAYER_BUILD=ON

      - name: Build for the simulator
        run: |
          set -o pipefail
          cmake --build build-ios --config Release --target Mireku_Standalone -- \
            -sdk iphonesimulator -arch arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build-ios.log | grep -E "error|warning: unused|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build-ios.log || { grep -E "error" build-ios.log | head -60; exit 1; }

      - name: Run in an iPad simulator and take screenshots
        run: |
          APP="$(find build-ios -name 'MIREKU.app' -type d | head -1)"
          [ -n "$APP" ] || { echo "no MIREKU.app was built"; exit 1; }
          echo "app: $APP"; /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          mkdir -p ipad-shots
          xcrun simctl list devices available | grep -i ipad || true
          UDID="$(xcrun simctl list devices available | grep -i 'iPad Pro' | grep -oE '[0-9A-F-]{36}' | head -1)"
          [ -n "$UDID" ] || UDID="$(xcrun simctl list devices available | grep -i 'iPad' | grep -oE '[0-9A-F-]{36}' | head -1)"
          [ -n "$UDID" ] || { echo "no iPad simulator on this runner"; exit 1; }
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.mireku.app
          sleep 25
          xcrun simctl io "$UDID" screenshot ipad-shots/01-first-launch.png
          sleep 10
          xcrun simctl io "$UDID" screenshot ipad-shots/02-after-10s.png
          xcrun simctl spawn "$UDID" launchctl list | grep -i mireku || echo "MIREKU is not running (it may have crashed)"
          cp build-ios.log ipad-shots/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MIREKU-iPad-simulator
          path: |
            ipad-shots/
            build-ios.log
          if-no-files-found: warn

  windows-installer:
    if: ${{ !inputs.ios }}
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      # The STUDIO key the sealed library is opened with (engine/Sealed.h): 64 hex
      # characters, the same key ~/.amanorsac/studio-keys.json holds on the studio
      # machine. Without it the configure compiles the TEST key and the installer
      # script refuses to package.
      AOFAS_STUDIO_KEY: ${{ secrets.AOFAS_STUDIO_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # The C++ suite plays notes through real .jmi bundles, and testdata/*.jmi/
      # is gitignored - those are sample content, not source. Without them every
      # audio assertion fails for want of an instrument, which is exactly how the
      # first run of this workflow failed.
      #
      # The FULL generator, not ci.yml's --quick one: quick makes 8 notes x 2
      # layers = 16 zones, and this suite asserts the spec size of 30 x 4 = 120,
      # which is how the second run failed.
      - name: Generate the test fixtures
        run: |
          npm ci
          npm run build -w @jm/jmi-format
          npm run generate -w @jm/placeholder-gen

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build and package
        shell: pwsh
        run: |
          $splat = @{ SkipTests = $false }
          if ("${{ inputs.tester }}" -eq "true") { $splat.Tester = $true }
          & "apps\signature\scripts\build-windows-installer.ps1" @splat

      - uses: actions/upload-artifact@v4
        with:
          name: MIREKU-Windows
          path: apps/signature/release/*.exe
          if-no-files-found: error

  macos-pkg:
    # A tag build always makes both. A hand-started build can leave macOS out.
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.windows_only && !inputs.ios) }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      MIREKU_TESTER: ${{ inputs.tester && '1' || '0' }}
      AOFAS_STUDIO_KEY: ${{ secrets.AOFAS_STUDIO_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # See the Windows job: build-mac-pkg.sh runs MirekuTests, which needs real
      # .jmi bundles, and testdata/*.jmi/ is gitignored sample content.
      - name: Generate the test fixtures
        run: |
          npm ci
          npm run build -w @jm/jmi-format
          npm run generate -w @jm/placeholder-gen

      - name: Import the signing certificates
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_INSTALLER_P12: ${{ secrets.MAC_INSTALLER_P12 }}
          MAC_INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # An empty secret means the org secret is not visible to this repository;
          # say so now rather than shipping an unsigned package by accident.
          for v in MAC_CERT_P12 MAC_INSTALLER_P12 ASC_KEY_P8 APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::secret $v is empty - check the organisation secret's repository visibility"; exit 1; }
          done
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          echo "$MAC_CERT_P12"      | tr -d '[:space:]' | base64 --decode > app.p12
          echo "$MAC_INSTALLER_P12" | tr -d '[:space:]' | base64 --decode > installer.p12
          trim () { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          security import app.p12       -k "$KEYCHAIN" -P "$(trim "$MAC_CERT_PASSWORD")"      -T /usr/bin/codesign -T /usr/bin/productsign
          security import installer.p12 -k "$KEYCHAIN" -P "$(trim "$MAC_INSTALLER_PASSWORD")" -T /usr/bin/codesign -T /usr/bin/productsign
          rm -f app.p12 installer.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-identity -v

          # The key may have been stored as base64 or as the raw .p8 text.
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          else printf '%s' "$ASC_KEY_P8" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/asc.p8"; fi
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarise and staple
        run: bash apps/signature/scripts/build-mac-pkg.sh

      - name: Remove the key material
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"; security delete-keychain build.keychain || true

      - uses: actions/upload-artifact@v4
        with:
          name: MIREKU-macOS
          path: |
            apps/signature/release/*.pkg
            apps/signature/release/auval.txt
          if-no-files-found: error
