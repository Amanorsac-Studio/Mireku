<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <pattern id="strings-web" patternUnits="userSpaceOnUse" width="120" height="120">
      <!-- Dark Canvas -->
      <rect width="120" height="120" fill="#0C0A07"/>
      
      <!-- Background Geometric Shards -->
      <polygon points="0,0 60,60 0,60" fill="#8B1A1A"/>
      <polygon points="120,0 60,60 120,60" fill="#274E27"/>
      <polygon points="60,60 0,120 120,120" fill="#D9A648"/>
      <polygon points="0,0 120,0 60,60" fill="#1A1510"/>

      <!-- Web Center Point & Spider Abstraction -->
      <circle cx="60" cy="60" r="6" fill="#D9A648"/>
      <circle cx="60" cy="52" r="3" fill="#D9A648"/>
      
      <!-- Radial Web Lines -->
      <line x1="60" y1="60" x2="0" y2="0" stroke="#D9A648" stroke-width="1.5" stroke-dasharray="3 1"/>
      <line x1="60" y1="60" x2="120" y2="0" stroke="#D9A648" stroke-width="1.5" stroke-dasharray="3 1"/>
      <line x1="60" y1="60" x2="0" y2="120" stroke="#D9A648" stroke-width="1.5" stroke-dasharray="3 1"/>
      <line x1="60" y1="60" x2="120" y2="120" stroke="#D9A648" stroke-width="1.5" stroke-dasharray="3 1"/>
      <line x1="60" y1="0" x2="60" y2="120" stroke="#D9A648" stroke-width="1.5"/>
      <line x1="0" y1="60" x2="120" y2="60" stroke="#D9A648" stroke-width="1.5"/>

      <!-- Concentric Web Rings (Octagons) -->
      <polygon points="60,25 85,35 95,60 85,85 60,95 35,85 25,60 35,35" fill="none" stroke="#D9A648" stroke-width="1.5"/>
      <polygon points="60,10 95,25 110,60 95,95 60,110 25,95 10,60 25,25" fill="none" stroke="#D9A648" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#strings-web)"/>
</svg>
